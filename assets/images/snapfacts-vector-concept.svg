<svg width="420" height="120" viewBox="0 0 420 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Snapfacts - Real-Time AI &amp; Industry Intelligence">
  <defs>
    <linearGradient id="vector-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="bar-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>

  <!-- Circular Radar & Empirical Vector Emblem -->
  <g transform="translate(10, 10)">
    <!-- Radar Outer Ring -->
    <circle cx="50" cy="50" r="46" fill="none" stroke="#1D4ED8" stroke-width="4.5" />
    
    <!-- Radar Grid Latitude & Longitude arcs -->
    <path d="M 50 4 A 46 46 0 0 1 96 50" fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="4,4" opacity="0.6" />
    <path d="M 50 18 A 32 32 0 0 1 82 50" fill="none" stroke="#38BDF8" stroke-width="1.8" opacity="0.75" />
    <line x1="50" y1="4" x2="50" y2="50" stroke="#2563EB" stroke-width="1.5" opacity="0.6" />
    <line x1="4" y1="50" x2="50" y2="50" stroke="#2563EB" stroke-width="1.5" opacity="0.6" />

    <!-- Benchmark Data Columns (Bars) -->
    <rect x="22" y="66" width="6" height="24" rx="3" fill="#00D2FF" />
    <rect x="33" y="56" width="6" height="34" rx="3" fill="#00D2FF" />
    <rect x="44" y="48" width="6" height="42" rx="3" fill="#38BDF8" />
    <rect x="55" y="42" width="6" height="48" rx="3" fill="#0284C7" />
    <rect x="66" y="34" width="6" height="56" rx="3" fill="#1D4ED8" />
    <rect x="77" y="24" width="6" height="66" rx="3" fill="#1E40AF" />

    <!-- Ascending Empirical Trend Vector (Arrow) -->
    <path d="M 12 70 Q 40 68 76 18" fill="none" stroke="#1D4ED8" stroke-width="7" stroke-linecap="round" />
    <!-- Arrowhead -->
    <polygon points="72,12 88,14 82,30" fill="#1D4ED8" />
  </g>

  <!-- Typography: Wordmark + Tagline -->
  <text x="132" y="66" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif" font-size="44" font-weight="700" letter-spacing="-0.03em" fill="#0B0F19">Snapfacts</text>
  <text x="134" y="92" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600" letter-spacing="0.14em" fill="#64748B">REAL-TIME AI &amp; INDUSTRY INTELLIGENCE</text>
</svg>
