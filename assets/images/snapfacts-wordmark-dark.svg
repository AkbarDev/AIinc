<svg width="460" height="120" viewBox="0 0 460 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Snapfacts - Real-Time AI &amp; Industry Intelligence">
  <defs>
    <!-- Vibrant High-Signal Gradient -->
    <linearGradient id="vector-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Radar Outer Ring Gradient -->
    <linearGradient id="ring-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Soft Ambient Elevation Shadow -->
    <filter id="vector-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#00D2FF" flood-opacity="0.35" />
    </filter>
  </defs>

  <style>
    .brand-wordmark {
      fill: #FFFFFF;
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 700;
      font-size: 46px;
      letter-spacing: -0.03em;
    }
    .brand-descriptor {
      fill: #94A3B8;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 0.14em;
    }
    @media (max-width: 320px) {
      .brand-descriptor { display: none !important; }
      .brand-wordmark { font-size: 52px; y: 72px; }
    }
  </style>

  <!-- Empirical Radar & Trend Vector Emblem -->
  <g transform="translate(12, 10)">
    <!-- Outer Radar Ring -->
    <circle cx="50" cy="50" r="46" fill="none" stroke="url(#ring-grad)" stroke-width="5" filter="url(#vector-glow)" />

    <!-- Upper-Left Radar Latitude / Longitude Grid -->
    <path d="M 50 4 A 46 46 0 0 0 4 50" fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="4,4" opacity="0.65" />
    <path d="M 50 18 A 32 32 0 0 0 18 50" fill="none" stroke="#00D2FF" stroke-width="1.8" opacity="0.7" />
    <line x1="50" y1="4" x2="50" y2="50" stroke="#2563EB" stroke-width="1.5" opacity="0.6" />
    <line x1="4" y1="50" x2="50" y2="50" stroke="#2563EB" stroke-width="1.5" opacity="0.6" />

    <!-- Benchmark Data Columns (LLM Intelboard Bars) -->
    <rect x="22" y="64" width="6.5" height="24" rx="3.25" fill="#00D2FF" />
    <rect x="33.5" y="52" width="6.5" height="36" rx="3.25" fill="#00E5FF" />
    <rect x="45" y="44" width="6.5" height="44" rx="3.25" fill="#38BDF8" />
    <rect x="56.5" y="34" width="6.5" height="54" rx="3.25" fill="#0284C7" />
    <rect x="68" y="24" width="6.5" height="64" rx="3.25" fill="#1D4ED8" />
    <rect x="79.5" y="16" width="6.5" height="72" rx="3.25" fill="#1E40AF" />

    <!-- Ascending Trend Vector (Momentum Polyline) -->
    <path d="M 14 70 L 36 50 L 48 58 L 84 18" fill="none" stroke="#38BDF8" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Arrowhead -->
    <polygon points="73,12 92,14 86,33" fill="#38BDF8" />
  </g>

  <!-- Typography Lockup -->
  <!-- Subtle Architectural Divider -->
  <line x1="128" y1="28" x2="128" y2="92" stroke="rgba(255, 255, 255, 0.16)" stroke-width="1.5" />

  <!-- Wordmark & Descriptor -->
  <text x="146" y="66" class="brand-wordmark">Snapfacts</text>
  <text x="148" y="91" class="brand-descriptor">REAL-TIME AI &amp; INDUSTRY INTELLIGENCE</text>
</svg>
