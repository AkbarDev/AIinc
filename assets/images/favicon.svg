<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Snapfacts Favicon">
  <defs>
    <linearGradient id="fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>
    <linearGradient id="fav-accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="fav-bars" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>

  <!-- Squircle Base for App / Favicon Clarity -->
  <rect width="64" height="64" rx="16" fill="url(#fav-bg)" />

  <!-- Outer Radar Border -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="url(#fav-accent)" stroke-width="3" />

  <!-- Upper-left Radar Gridlines -->
  <path d="M 32 9 A 23 23 0 0 0 9 32" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="2.5,2.5" opacity="0.75" />
  <path d="M 32 17 A 15 15 0 0 0 17 32" fill="none" stroke="#00D2FF" stroke-width="1.2" opacity="0.6" />
  <line x1="32" y1="9" x2="32" y2="32" stroke="#38BDF8" stroke-width="1" opacity="0.5" />
  <line x1="9" y1="32" x2="32" y2="32" stroke="#38BDF8" stroke-width="1" opacity="0.5" />

  <!-- Benchmark Data Columns (Bars) -->
  <rect x="18" y="38" width="3.2" height="12" rx="1.6" fill="#00D2FF" />
  <rect x="23.5" y="32" width="3.2" height="18" rx="1.6" fill="#00E5FF" />
  <rect x="29" y="27" width="3.2" height="23" rx="1.6" fill="#38BDF8" />
  <rect x="34.5" y="22" width="3.2" height="28" rx="1.6" fill="#0284C7" />
  <rect x="40" y="18" width="3.2" height="32" rx="1.6" fill="#2563EB" />

  <!-- Ascending Empirical Vector (Arrow) -->
  <path d="M 14 42 L 24 34 L 30 38 L 47 16" fill="none" stroke="#00D2FF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Arrow Head -->
  <polygon points="41,13 51,12 49,22" fill="#00D2FF" />
</svg>
