<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting to Snapfacts...</title>
    <script>
        // GitHub Pages SPA router fallback
        // Preserves path so /category/ai loads directly
        (function() {
            var pathname = window.location.pathname;
            var search = window.location.search;
            var hash = window.location.hash;
            var match = pathname.match(/\/category\/([a-z0-9_-]+)/i);
            if (match && match[1]) {
                // Redirect to homepage with category parameter preserved
                var redirectUrl = '/?category=' + encodeURIComponent(match[1]);
                if (hash) redirectUrl += hash;
                window.location.replace(redirectUrl);
            } else {
                window.location.replace('/' + (search ? search : '') + (hash ? hash : ''));
            }
        })();
    </script>
</head>
<body style="background: #ffffff; color: #111827; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <p>Redirecting to <a href="/" style="color: #2563eb;">Snapfacts</a>...</p>
</body>
</html>
